name: huffaz_app
description: Quran memorization institution management system — native Flutter app.
publish_to: 'none'

version: 1.0.4+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Local Persistence (Offline-first)
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Animations
  flutter_animate: ^4.5.2

  # Fonts
  google_fonts: ^6.2.1

  # Date/Number formatting
  intl: ^0.19.0

  # Icons (cupertino-style)
  cupertino_icons: ^1.0.8

  # Image / Cache
  cached_network_image: ^3.4.1

  # Shared Preferences (for theme preference)
  shared_preferences: ^2.3.4

  # UUID for local IDs
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#12362b"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter_native_splash:
  color: "#12362b"
  image: "assets/splash_logo.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/
